<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Trail by Train · Hiking in nature, by train and bus</title>
    <meta
      name="description"
      content="Hiking in nature, by train and bus: trains, buses, trails and terrain on one map, to plan your next day outside."
    />
    <link rel="icon" href="%BASE_URL%favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="%BASE_URL%favicon.svg" type="image/svg+xml" sizes="any" />
    <link rel="apple-touch-icon" href="%BASE_URL%apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="%BASE_URL%site.webmanifest" />
    <meta name="theme-color" content="#234e3d" />

    <!-- Resolve the theme before first paint so the map chrome never flashes
         the wrong palette. Mirrors src/lib/themeStorage.ts — keep in step. -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('hp.theme');
          if (pref !== 'light' && pref !== 'dark') {
            pref = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          document.documentElement.setAttribute('data-theme', pref);
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'light');
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
