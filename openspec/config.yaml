schema: spec-driven

context: |
  Trail by Train is a browser-based app to plan car-free hikes in France.
  Core idea: put public transport (train and bus), hiking trails and terrain
  on one map, so a hiker can plan a route between stations and stops,
  inspect their own GPX tracks, and discover hikes published by car-free
  hiking authors.

  Tech stack:
    - React + TypeScript
    - Vite (build/dev server)
    - MapLibre GL JS (map rendering, vector + raster layers), PMTiles
    - No backend: fully static SPA, deployed to GitHub Pages. Data is either
      fetched from public services at runtime (IGN Géoplateforme tiles and
      altimetry, OpenStreetMap/OpenTopoMap tiles) or generated by build
      scripts and published as the `data-latest` release by the Data
      workflow.

  Geographic scope: mainland France and Corsica.

  Conventions:
    - Conventional commits.
    - Only open data, with its licence and attribution recorded where it is
      configured (e.g. providers.config.mjs) and listed in DATA_LICENSES.md.
      Never redistribute third-party content (routes, tracks, text) without
      a licence that allows it: link to it instead.
    - Generated datasets are never committed; scripts that build them are.
    - Code is MIT-licensed.

