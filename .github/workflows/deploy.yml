# Build the app with the latest datasets and publish it to GitHub Pages.
# Runs on every push to main, and is called by data.yml after each refresh.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Fetch datasets from the data-latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/data"
          if gh release download data-latest -p '*.tar.gz' -D "$RUNNER_TEMP/data" -R "$GITHUB_REPOSITORY"; then
            for f in "$RUNNER_TEMP"/data/*.tar.gz; do tar -xzf "$f" -C public; done
          else
            echo "::warning::No data-latest release yet — deploying the app without datasets. Run the Data workflow."
          fi
      - name: Build
        run: npm run build
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
      # GitHub Pages has no SPA fallback; serving index.html as the 404 page
      # gives deep links the app instead of GitHub's error page.
      - run: cp dist/index.html dist/404.html
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
