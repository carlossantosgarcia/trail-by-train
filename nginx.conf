server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # The base image ships with `gzip` commented out, so JSON went over the
    # wire raw. That was tolerable for the small manifests; it is not for the
    # ~3 MB place index, which compresses to under 900 KB. PMTiles archives
    # are already compressed internally and are excluded by type.
    gzip on;
    gzip_types application/json application/geo+json text/plain;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    # nginx defaults to level 1. The place index is the largest JSON served and
    # is highly repetitive, so the extra CPU is worth ~300 KB per cold load;
    # it is compressed once per request and the file changes only on a rebuild.
    gzip_comp_level 6;

    # Data assets (PMTiles archives, GeoJSON) must never fall through to the
    # SPA. Without this, a missing archive returns index.html with HTTP 200
    # and the PMTiles reader fails trying to parse HTML as a header, which
    # reads like a corrupt archive rather than a missing one. 404 here
    # lets the app say plainly that a dataset is not deployed.
    #
    # PMTiles are read with range requests; nginx already answers 206
    # Partial Content for static files, so no extra directive is needed
    # here — just don't let the SPA fallback swallow the request.
    location /data/ {
        try_files $uri =404;
    }

    # SPA fallback. When serving under a sub-path behind a reverse proxy, build
    # with VITE_BASE_PATH=/<sub-path>/ and have the proxy strip that prefix.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Long-cache hashed Vite assets.
    location ~* ^/assets/.*\.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
